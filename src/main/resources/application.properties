spring.application.name=yourlivesound
server.servlet.encoding.charset=UTF-8
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
server.port=8082
spring.thymeleaf.cache=true

# Contact delivery is configured outside Git on the production host.
app.contact.form-action=${APP_CONTACT_FORM_ACTION:}
app.asset-version=${APP_ASSET_VERSION:dev}

# Keep shutdown bounded so Docker can stop Java cleanly without SIGKILL.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=10s

# This site exposes only the liveness endpoint used by Docker and external probes.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# Conservative defaults for a small site on a shared VPS.
server.compression.enabled=true
server.tomcat.threads.max=50
server.tomcat.threads.min-spare=2
server.tomcat.max-connections=200
server.tomcat.accept-count=50

server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
