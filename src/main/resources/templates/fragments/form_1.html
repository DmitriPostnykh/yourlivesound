<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body>
<div th:fragment="form_1" class="contact-form-wrapper">
    <p th:if="${param.sent != null}" class="form-success" role="status">
        Thank you. Your request has been sent.
    </p>

    <form th:if="${contactFormConfigured}"
          class="contact-form"
          th:action="${contactFormAction}"
          method="post">
        <input type="hidden" name="_subject" value="New project request from Your Live Sound">
        <input type="hidden" name="_template" value="table">
        <input type="hidden" name="_next"
               value="https://yourlivesound.com/contacts?sent=true#contact">

        <div class="honeypot" aria-hidden="true">
            <label for="company-website">Leave this field empty</label>
            <input id="company-website" type="text" name="_honey" tabindex="-1" autocomplete="off">
        </div>

        <div class="form-field">
            <label for="name">Name</label>
            <input id="name" type="text" name="name" autocomplete="name" required maxlength="120">
        </div>

        <div class="form-field">
            <label for="email">Email</label>
            <input id="email" type="email" name="email" autocomplete="email" required maxlength="254">
        </div>

        <div class="form-field">
            <label for="phone">Phone <span class="optional">(optional)</span></label>
            <input id="phone" type="tel" name="phone" autocomplete="tel" maxlength="40">
        </div>

        <div class="form-field">
            <label for="message">Project details</label>
            <textarea id="message" name="message" rows="7" required maxlength="5000"
                      placeholder="Tell me about the venue, date, audience and sound requirements."></textarea>
        </div>

        <button class="submit-button" type="submit">Send request</button>
        <p class="form-privacy">
            This form is processed by
            <a href="https://formsubmit.co/" rel="noopener noreferrer">FormSubmit</a>.
            Submission data may be retained by that service for up to 30 days.
        </p>
    </form>

    <p th:unless="${contactFormConfigured}" class="form-unavailable" role="status">
        The contact form is temporarily unavailable. Please try again later.
    </p>
</div>
</body>
</html>
