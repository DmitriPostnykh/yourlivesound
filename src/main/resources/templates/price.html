<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Request pricing for live sound, system setup, studio production and audio consulting from Your Live Sound.">
    <link rel="canonical" href="https://yourlivesound.com/price">
    <title>Pricing | Your Live Sound</title>
    <link rel="stylesheet" th:href="@{/css/styles-wrap.css}">
    <link rel="stylesheet" th:href="@{/css/menu.css}">
    <link rel="stylesheet" th:href="@{/css/form_1.css}">
</head>
<body>
<main class="page-shell">
    <section class="panel contact-section" id="contact">
        <p class="eyebrow">Your Live Sound</p>
        <h1>Pricing</h1>
        <p class="page-lead">
            Every project is quoted individually. The venue, date, audience size, available equipment,
            crew requirements and production schedule all affect the scope. Send those details for a clear estimate.
        </p>
        <div th:replace="~{fragments/form_1 :: form_1}"></div>
    </section>
    <div th:replace="~{fragments/menu :: menu}"></div>
</main>
<footer class="site-footer">
    <p>&copy; <span th:text="${currentYear}">2026</span> Dmitrii Postnykh. All rights reserved.</p>
</footer>
</body>
</html>
