<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Send a project request to Your Live Sound for live, studio, consulting or equipment work.">
    <link rel="canonical" href="https://yourlivesound.com/registration">
    <title>Project Request | Your Live Sound</title>
    <link rel="stylesheet" th:href="@{/css/styles-wrap.css(v=${assetVersion})}">
    <link rel="stylesheet" th:href="@{/css/menu.css(v=${assetVersion})}">
    <link rel="stylesheet" th:href="@{/css/form_1.css(v=${assetVersion})}">
</head>
<body>
<main class="page-shell">
    <section class="panel contact-section" id="contact">
        <p class="eyebrow">Your Live Sound</p>
        <h1>Project Request</h1>
        <p class="page-lead">
            Share the essential details of your project. Venue information, timing, lineup, technical rider
            and any existing system plan will make the first conversation more useful.
        </p>
        <div th:replace="~{fragments/form_1 :: form_1}"></div>
    </section>
    <div th:replace="~{fragments/menu :: menu}"></div>
</main>
<footer class="site-footer">
    <p>&copy; <span th:text="${currentYear}">2026</span> Dmitrii Postnykh. All rights reserved.</p>
</footer>
</body>
</html>
