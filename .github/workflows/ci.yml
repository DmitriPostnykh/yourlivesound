name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Test
        run: ./mvnw --batch-mode --no-transfer-progress verify
      - name: Build container
        run: docker build --build-arg VCS_REF="$GITHUB_SHA" --tag yourlivesound:ci .
